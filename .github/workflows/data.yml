name: Validate latest data

on:
  workflow_call:
  workflow_dispatch:

jobs:
  format-check:
    uses: ./.github/workflows/format.yml

  validate:
    needs: format-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate latest year data
        run: npm run validate:data
